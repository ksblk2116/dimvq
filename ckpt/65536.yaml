ckpt_path: /mnt/petrelfs/zhangfang/SimVQ/results/simvq/dimvq65536weight0.001codebookbatchnorm/last.ckpt
model:
  class_path: taming.models.vq.VQModel
  init_args:
    ddconfig:
      double_z: false
      z_channels: 128
      resolution: 128
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult:
      - 1
      - 2
      - 2
      - 4
      num_res_blocks: 2
      norm_type: batchnorm
      norm_groups: 32
    lossconfig:
      target: taming.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 3
        disc_start: 0
        disc_weight: 0.8
        gen_loss_weight: 0.1
        codebook_weight: 0.1
        commit_weight: 1.0
        codebook_enlarge_ratio: 0
        codebook_enlarge_steps: 2000
    quantconfig:
      target: taming.modules.vqvae.simvq.SimVQ
      params:
        n_e: 65536
        e_dim: 128
        beta: 0.25
        legacy: false
        embedding_init: gaussian
        l2_norm: false
        num_groups: 1
        disentangle_loss_type: codebook_orth
        disentangle_loss_weight: 0.001
        inner_loss_weight: 0.0
    ckpt_path: null
    ignore_keys: []
    image_key: image
    colorize_nlabels: null
    monitor: null
    learning_rate: 0.0001
    warmup_epochs: 1.0
    scheduler_type: None
    accumulate_steps: 1
    min_learning_rate: 0
    use_ema: true
    stage: null
    log_image_every_n_steps: 1
    no_vq: false
data:
  class_path: main.DataModuleFromConfig
  init_args:
    batch_size: 64
    train:
      target: taming.data.imagenet.ImageNetTrain
      params:
        config:
          size: 128
          subset: null
    validation:
      target: taming.data.imagenet.ImageNetValidation
      params:
        config:
          size: 128
          subset: null
    test:
      target: taming.data.imagenet.ImageNetValidation
      params:
        config:
          size: 128
          subset: null
    wrap: false
    num_workers: 8
